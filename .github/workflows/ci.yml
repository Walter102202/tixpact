# CI gates for every push and pull request. Three parallel jobs; all three must pass before a merge.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still going for the previous commit, except on `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  contract:
    name: contract (build, clippy, sandbox tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain, components and target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        env:
          CARGO_NEAR_VERSION: 0.23.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
          cargo near --version
      - run: bash scripts/gate.sh contract

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash scripts/gate.sh web

  hygiene:
    name: hygiene (secrets, tracked files, wording)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan below walks the whole history

      - name: No private or ignored file is tracked
        run: |
          tracked=$(git ls-files | grep -E '^docs/hackathon/|^proyecto_entradas_near_diseno_y_fuentes\.md$|(^|/)\.env$|(^|/)\.env\.|(^|/)\.near-credentials/|\.(pem|key|p12|pfx)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::private files are tracked:"
            echo "$tracked"
            exit 1
          fi
          for pattern in 'docs/hackathon/' 'proyecto_entradas_near_diseno_y_fuentes.md' '.env' '.claude/settings.local.json'; do
            if ! grep -qxF "$pattern" .gitignore; then
              echo "::error::.gitignore no longer lists '$pattern'."
              exit 1
            fi
          done

      # Product rule: a ticket is called a ticket. The standard is named only in the README and docs.
      - name: The product never says NFT
        run: |
          if git grep -nE '\bNFTs?\b' -- web packages/client mcp ':!*.test.ts' ':!*.test.tsx'; then
            echo "::error::user-facing code says NFT (lines above). Call it a ticket."
            exit 1
          fi

      # The gitleaks CLI, pinned by version and verified against the release checksums, scans every
      # commit of every branch. (gitleaks/gitleaks-action only scans the pushed commits on push events.)
      - name: Secret scan over the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download "v$GITLEAKS_VERSION" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --no-banner --exit-code 1 .
