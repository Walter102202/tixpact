[package]
name = "ticket-escrow"
description = "Event tickets whose price stays reserved until an agreed verifier confirms the event."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# NEP-330: contracts built with cargo-near expose this link through `contract_source_metadata`.
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build settings (NEP-330), as generated by `cargo near new` 0.23.0.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[features]
# Test-only: lowers the callback gas so a callback fails after its transfer (plan: Task C2).
# The released wasm is built without it and `get_config().fault_injection` reports it.
fault-injection = []

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[lints]
workspace = true
