# Secret scan of the CI (job "hygiene"): the default gitleaks rules, plus one exception.
#
# The README and vercel.json pass the name of the test token's account to the web build:
# VITE_FAUCET_TOKENS=tusd.ticket-escrow-v2.testnet. An account name on NEAR is public by design,
# but the default "generic-api-key" rule reads "TOKENS=<value>" as a key.
#
# The exception is as narrow as it can be: it is tested against the secret a rule extracted (the
# default target), not against the line, and it matches that one account name and nothing else.
# Any other finding on the same line is still reported. If the token account changes, change it here.

[extend]
useDefault = true

[[allowlists]]
description = "The public account name of the test token, tusd.ticket-escrow-v2.testnet"
regexes = ['''^tusd\.ticket-escrow-v2\.testnet$''']
